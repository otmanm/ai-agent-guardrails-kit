name: tests
on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:
jobs:
  hooks-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Guard hook unit tests
        run: bash hooks/tests/run_tests.sh
      - name: Attack matrix (five abuse paths vs guards)
        run: bash tests/attack-matrix/run-matrix.sh
      - name: Phase 0 framework benchmark (local, no infra)
        run: bash benchmark/run-local.sh
